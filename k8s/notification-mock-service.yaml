apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notification-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-mock-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-mock-service
  template:
    metadata:
      labels:
        app: notification-mock-service
    spec:
      containers:
        - name: notification-mock-service
          image: assignment2-notification:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8003
          env:
            - name: NOTIFICATION_DB
              value: /data/notification.db
          volumeMounts:
            - name: database
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: notification-data
---
apiVersion: v1
kind: Service
metadata:
  name: notification-mock-service
spec:
  type: ClusterIP
  selector:
    app: notification-mock-service
  ports:
    - name: http
      port: 8003
      targetPort: http
