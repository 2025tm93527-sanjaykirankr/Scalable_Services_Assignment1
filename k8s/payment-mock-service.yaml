apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: payment-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-mock-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-mock-service
  template:
    metadata:
      labels:
        app: payment-mock-service
    spec:
      containers:
        - name: payment-mock-service
          image: assignment2-payment:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: PAYMENT_DB
              value: /data/payment.db
            - name: PAYMENT_MODE
              value: success
          volumeMounts:
            - name: database
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: payment-data
---
apiVersion: v1
kind: Service
metadata:
  name: payment-mock-service
spec:
  type: ClusterIP
  selector:
    app: payment-mock-service
  ports:
    - name: http
      port: 8002
      targetPort: http
