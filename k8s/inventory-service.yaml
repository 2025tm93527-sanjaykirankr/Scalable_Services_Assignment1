apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: inventory-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: assignment2-inventory:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: INVENTORY_DB
              value: /data/inventory.db
          volumeMounts:
            - name: database
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: database
          persistentVolumeClaim:
            claimName: inventory-data
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  type: ClusterIP
  selector:
    app: inventory-service
  ports:
    - name: http
      port: 8001
      targetPort: http
